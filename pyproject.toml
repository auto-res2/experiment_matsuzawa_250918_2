[project]
name = "lance_research"
version = "0.1.0"
description = "Experimental pipeline for LANCE: Low-rAnk, Norm- and Component-agnostic Energy-aware adaptation."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "typer[all]==0.9.0",
    "pyyaml==6.0.1",
    "datasets==2.15.0",
    "timm==0.9.12",
    "transformers==4.35.2",
    "scikit-learn==1.3.2",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scipy==1.11.4",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "mlflow==2.9.2",
    "wandb==0.16.1",
    "pynvml==11.5.0",
    "codecarbon==2.3.2",
    "fvcore==0.1.5.post20221221",
    "filterpy==1.4.5",
    "tqdm==4.66.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
